name: Dispatch centralized docs drift check

# Thin reusable workflow for source repositories. It validates the target pull
# request and sends a repository_dispatch event to the central AI automation
# repository through the Workflow Authentication GitHub App. The source repo
# never receives or uses a model credential.
#
# The central worker checks out the source repo's trusted base revision, reads
# its docs-drift rubric, reviews the PR diff, and reconciles the label/comment
# back on the source PR. The expected head SHA travels with each dispatch so the
# central worker can discard stale results after a newer push.
#
# Usage in a source repo:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#     workflow_dispatch:
#       inputs:
#         pr_number:
#           description: "PR number to check"
#           required: true
#           type: string
#
#   permissions:
#     pull-requests: read
#
#   jobs:
#     docs-drift:
#       uses: ClickHouse/integrations-shared-workflows/.github/workflows/claude-docs-drift.yml@main
#       with:
#         pr_number: ${{ github.event.inputs.pr_number }}
#       secrets:
#         WORKFLOW_AUTH_PUBLIC_APP_ID: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
#         WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      agent_path:
        description: >-
          Repo-relative path of the rubric agent file. If the file is absent on
          the trusted base revision, the central worker exits without a review.
        required: false
        type: string
        default: .claude/agents/docs-drift-reviewer.md
      label:
        description: >-
          Label applied while the PR has unresolved docs drift. Empty disables
          labeling and leaves the check comment-only.
        required: false
        type: string
        default: needs-docs
      model:
        description: Optional Claude model override. Empty uses the central default.
        required: false
        type: string
        default: ""
      max_turns:
        description: Maximum agent turns for the central docs-drift run.
        required: false
        type: number
        default: 30
      pr_number:
        description: >-
          PR number to check. Required for workflow_dispatch callers. Leave
          empty for pull_request callers, where it comes from the event.
        required: false
        type: string
        default: ""
      central_repo:
        description: Repository that receives the docs-drift dispatch.
        required: false
        type: string
        default: ClickHouse/integrations-ai-playground
    secrets:
      WORKFLOW_AUTH_PUBLIC_APP_ID:
        required: true
      WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch docs drift check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: docs-drift-dispatch-${{ github.repository }}-${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Validate configuration
        id: config
        env:
          CENTRAL_REPO: ${{ inputs.central_repo }}
          SOURCE_REPO: ${{ github.repository }}
          AGENT_PATH: ${{ inputs.agent_path }}
          LABEL: ${{ inputs.label }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          if [[ ! "$CENTRAL_REPO" =~ ^ClickHouse/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::central_repo must name a repository in the ClickHouse organization"
            exit 1
          fi
          if [[ "${SOURCE_REPO%%/*}" != "${CENTRAL_REPO%%/*}" ]]; then
            echo "::error::source and central repositories must have the same owner"
            exit 1
          fi
          if [[ ! "$AGENT_PATH" =~ ^[A-Za-z0-9._/-]+$ || "$AGENT_PATH" = /* || "$AGENT_PATH" = *".."* ]]; then
            echo "::error::agent_path must be a safe repo-relative path"
            exit 1
          fi
          if [[ "$LABEL" = *$'\n'* || "$LABEL" = *$'\r'* ]]; then
            echo "::error::label must not contain a newline"
            exit 1
          fi
          if [[ -n "$MODEL" && ! "$MODEL" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "::error::model contains unsupported characters"
            exit 1
          fi
          if [[ ! "$MAX_TURNS" =~ ^[0-9]+$ ]] || (( MAX_TURNS < 1 || MAX_TURNS > 100 )); then
            echo "::error::max_turns must be between 1 and 100"
            exit 1
          fi

          {
            echo "central_owner=${CENTRAL_REPO%%/*}"
            echo "central_name=${CENTRAL_REPO##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate relay token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.central_owner }}
          repositories: ${{ steps.config.outputs.central_name }}
          permission-contents: write

      - name: Resolve source pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          ALLOW_FORK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          PR_NUMBER="${INPUT_PR:-}"
          [[ -n "$PR_NUMBER" ]] || PR_NUMBER="${EVENT_PR:-}"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::no valid PR number; pass pr_number or trigger on pull_request"
            exit 1
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$SOURCE_REPO" \
            --json state,headRefOid,isCrossRepository)
          if [[ $(jq -r '.state' <<<"$PR_JSON") != "OPEN" ]]; then
            echo "::error::source PR is not open"
            exit 1
          fi
          if [[ $(jq -r '.isCrossRepository' <<<"$PR_JSON") == "true" && \
                "$ALLOW_FORK" != "true" ]]; then
            echo "::notice::fork PRs are skipped on pull_request events"
            exit 0
          fi

          {
            echo "number=$PR_NUMBER"
            echo "head_sha=$(jq -r '.headRefOid' <<<"$PR_JSON")"
            echo "allow_fork=$ALLOW_FORK"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch central docs drift check
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CENTRAL_REPO: ${{ inputs.central_repo }}
          SOURCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ALLOW_FORK: ${{ steps.pr.outputs.allow_fork }}
          AGENT_PATH: ${{ inputs.agent_path }}
          LABEL: ${{ inputs.label }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail

          jq -n \
            --arg source_repo "$SOURCE_REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg agent_path "$AGENT_PATH" \
            --arg label "$LABEL" \
            --arg model "$MODEL" \
            --argjson max_turns "$MAX_TURNS" \
            --arg allow_fork "$ALLOW_FORK" \
            '{
              event_type: "docs-drift-check",
              client_payload: {
                source_repo: $source_repo,
                pr_number: $pr_number,
                head_sha: $head_sha,
                agent_path: $agent_path,
                label: $label,
                model: $model,
                max_turns: $max_turns,
                allow_fork: $allow_fork
              }
            }' |
            gh api --method POST "repos/$CENTRAL_REPO/dispatches" --input -

          echo "Dispatched docs-drift check for $SOURCE_REPO#$PR_NUMBER at $HEAD_SHA"
